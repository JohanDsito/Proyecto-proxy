user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format seguridad '$remote_addr [$time_local] '
                         '"$request" $status '
                         'sqli=$sqli_detected '
                         'jwt=$jwt_presente';

    access_log /var/log/nginx/access.log seguridad;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # IPs privadas de las instancias EC2 separadas
    upstream backend1 {
        server 172.31.44.60:3001;
    }

    upstream backend2_2fa {
        server 172.31.35.87:3002;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/grupo5-proxy.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grupo5-proxy.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        set $sqli_detected 0;
        set $jwt_presente 0;

        if ($request_uri ~* "(union|select|or.*1.*=.*1|--|drop|insert|delete|xp_|exec)") {
            set $sqli_detected 1;
        }
        if ($args ~* "(union|select|or.*1.*=.*1|--|drop|insert|delete|xp_|exec)") {
            set $sqli_detected 1;
        }

        location / {
            if ($sqli_detected = 1) {
                return 403 '{"error":"Acceso denegado","motivo":"Patron SQLi detectado"}';
            }
            proxy_pass         http://backend1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /auth/ {
            if ($sqli_detected = 1) {
                return 403 '{"error":"Acceso denegado","motivo":"Patron SQLi detectado"}';
            }
            proxy_pass         http://backend2_2fa;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /api/ {
            if ($sqli_detected = 1) {
                return 403 '{"error":"Acceso denegado","motivo":"Patron SQLi detectado"}';
            }
            if ($http_authorization ~ "^Bearer .+") {
                set $jwt_presente 1;
            }
            if ($jwt_presente = 0) {
                return 401 '{"error":"Token JWT requerido"}';
            }
            proxy_pass         http://backend1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Authorization $http_authorization;
        }

        location /metrics/ {
            proxy_pass         http://backend1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}